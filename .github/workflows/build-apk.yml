name: Build APK

on:
  push:
    branches: ["s25-preset-cam"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar plataforma Android
        run: |
          SDK_MANAGER_PATH=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          yes | "$SDK_MANAGER_PATH" --licenses >/dev/null || true
          "$SDK_MANAGER_PATH" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Gerar APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk S25-Preset-Cam-v1.1.1.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: S25-Preset-Cam-APK
          path: S25-Preset-Cam-v1.1.1.apk
          if-no-files-found: error

      - name: Disponibilizar APK na branch
        run: |
          mkdir -p release
          cp S25-Preset-Cam-v1.1.1.apk release/S25-Preset-Cam-v1.1.1.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/S25-Preset-Cam-v1.1.1.apk
          git commit -m "Adicionar APK v1.1.1 com correção de cores [skip ci]"
          git push
